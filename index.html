<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Urban Nest — Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F9;
    --surface:#FFFFFF;
    --navy:#1B3A7A;
    --navy-deep:#10193A;
    --sidebar:#0F1B3D;
    --sidebar-hover:rgba(255,255,255,0.06);
    --sidebar-active:rgba(255,255,255,0.10);
    --sidebar-text:rgba(229,233,246,0.62);
    --yellow:#FFC93C;
    --ink:#1A1F2E;
    --muted:#6B7280;
    --border:#E4E7EF;
    --success:#198754;
    --success-bg:#E7F6EE;
    --warning:#B5740F;
    --warning-bg:#FCF1DD;
    --danger:#C5342E;
    --danger-bg:#FCEAEA;
    --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .shell{display:flex;min-height:100vh;}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:228px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;
  }
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;}
  .badge{
    width:34px;height:34px;border-radius:9px;flex-shrink:0;
    background:linear-gradient(160deg, var(--yellow) 50%, var(--navy) 50%);
    border:1.5px solid rgba(255,255,255,0.18);
  }
  .brand-name{font-weight:800;font-size:15.5px;letter-spacing:0.2px;line-height:1.15;}
  .brand-name .urban{color:var(--yellow);}
  .brand-name .nest{color:#fff;}
  .brand-tagline{font-size:10.5px;color:rgba(229,233,246,0.42);font-weight:600;letter-spacing:1.1px;text-transform:uppercase;margin-top:2px;}

  .sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;
    appearance:none;border:none;background:none;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;
    color:var(--sidebar-text);text-align:left;width:100%;transition:background .15s ease,color .15s ease;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .nav-item:hover{background:var(--sidebar-hover);color:#fff;}
  .nav-item.active{background:var(--sidebar-active);color:#fff;}
  .nav-item.active svg{color:var(--yellow);}

  .sidebar-foot{padding:10px 8px 2px;font-size:11px;color:rgba(229,233,246,0.34);font-weight:600;border-top:1px solid rgba(255,255,255,0.08);margin-top:10px;}

  /* ---------- main ---------- */
  .main-wrap{flex:1;min-width:0;}
  .main-content{max-width:1140px;margin:0 auto;padding:30px 36px 70px;}

  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:26px;}
  .topbar h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-0.2px;}
  .topbar-sub{font-size:13px;color:var(--muted);margin-top:3px;font-weight:500;}
  .topbar-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .topbar-date{font-size:12.5px;color:var(--muted);font-weight:600;}
  .role-control{display:flex;align-items:center;gap:8px;}
  .role-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;}
  .role-owner{background:#EAF0FB;color:var(--navy);}
  .role-staff{background:var(--warning-bg);color:var(--warning);}
  .role-toggle{background:none;border:1px solid var(--border);color:var(--ink);font-family:'Inter',sans-serif;font-weight:700;font-size:12px;padding:6px 10px;border-radius:7px;cursor:pointer;}
  .role-toggle:hover{border-color:var(--navy);}
  .staff-note{font-size:12.5px;color:var(--warning);font-weight:700;background:var(--warning-bg);padding:8px 12px;border-radius:8px;}
  .save-pill{
    font-size:12px;font-weight:700;color:var(--muted);
    padding:6px 12px;border-radius:20px;background:var(--surface);border:1px solid var(--border);
    display:flex;align-items:center;gap:6px;
  }
  .save-pill.saved{color:var(--success);}
  .save-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--muted);}
  .save-pill.saved::before{background:var(--success);}

  .panel{display:none;}
  .panel.active{display:block;}

  /* ---------- KPI cards ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .kpi-card{display:flex;gap:13px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);}
  .kpi-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .kpi-icon svg{width:18px;height:18px;}
  .icon-navy{background:#EAF0FB;color:var(--navy);}
  .icon-success{background:var(--success-bg);color:var(--success);}
  .icon-warning{background:var(--warning-bg);color:var(--warning);}
  .icon-danger{background:var(--danger-bg);color:var(--danger);}
  .kpi-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
  .kpi-value{font-size:23px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-0.2px;}
  .kpi-sub{font-size:12px;color:var(--muted);margin-top:3px;font-weight:500;}

  /* ---------- bed status bar (signature) ---------- */
  .bed-bar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px;}
  .bed-bar-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .bed-bar-head h3{margin:0;font-size:14.5px;font-weight:800;}
  .bed-bar-sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:500;}
  .bed-total-edit{display:inline-block;}
  .bed-total-edit input{
    width:46px;font-family:'Inter',sans-serif;font-weight:800;font-size:12.5px;color:var(--navy);
    border:none;border-bottom:1.5px dashed var(--border);background:none;padding:0 0 1px;text-align:center;
  }
  .bed-bar-track{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--border);width:100%;}
  .bed-seg{height:100%;transition:width .3s ease;}
  .seg-paid{background:var(--success);}
  .seg-pending{background:var(--warning);}
  .seg-overdue{background:var(--danger);}
  .seg-vacant{background:#D9DCE6;}
  .seg-cash{background:var(--yellow);}
  .seg-online{background:var(--navy);}
  .bed-bar-legend{display:flex;gap:18px;margin-top:13px;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot-paid{background:var(--success);}
  .dot-pending{background:var(--warning);}
  .dot-overdue{background:var(--danger);}
  .dot-vacant{background:#D9DCE6;}
  .dot-cash{background:var(--yellow);}
  .dot-online{background:var(--navy);}
  .bed-overflow-note{margin-top:11px;font-size:12px;color:var(--warning);font-weight:600;}

  .notice-row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .notice-row:last-child{border-bottom:none;}
  .notice-row-main{min-width:130px;}
  .notice-row-dates{display:flex;gap:24px;font-size:13px;flex-wrap:wrap;}
  .notice-row-dates .sub-cell{display:block;margin-bottom:2px;}
  .notice-row-status{text-align:right;min-width:170px;}

  .breadcrumb{display:flex;align-items:center;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
  .breadcrumb-link{background:none;border:none;color:var(--navy);font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;padding:0;}
  .breadcrumb-link:hover{text-decoration:underline;}
  .breadcrumb-sep{color:var(--muted);font-size:13px;}
  .breadcrumb-current{color:var(--ink);font-weight:800;font-size:13px;}

  .explorer-list{display:flex;flex-direction:column;gap:9px;}
  .explorer-card{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .12s ease;}
  .explorer-card:hover{border-color:var(--navy);}

  .bed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:8px;}
  .bed-slot{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:9px;border:1px solid var(--border);}
  .bed-slot.bed-occupied{background:var(--success-bg);}
  .bed-slot.bed-empty{background:var(--bg);}

  /* ---------- detail panels ---------- */
  .panel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
  .mini-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow);}
  .mini-card h3{margin:0;font-size:13.5px;color:var(--ink);font-weight:800;}
  .panel-tag{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;margin-bottom:8px;}
  .panel-card-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .mini-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .mini-row:last-child{border-bottom:none;}
  .mini-row span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mini-empty{color:var(--muted);font-size:13px;padding:6px 0;}

  /* ---------- daily log ---------- */
  .date-nav{display:flex;align-items:center;gap:8px;}
  .date-nav input[type=date]{padding:8px 10px;}
  .duty-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .duty-row:last-child{border-bottom:none;}
  .duty-row-label{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13.5px;cursor:pointer;}
  .duty-check{color:var(--success);font-weight:800;}
  .duty-empty{color:var(--border);}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .search-wrap{position:relative;flex:1;max-width:300px;min-width:180px;}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none;}
  .search-input{
    font-family:'Inter',sans-serif;border:1px solid var(--border);border-radius:9px;padding:9px 12px 9px 33px;
    font-size:13.5px;background:var(--surface);width:100%;
  }
  .search-input:focus,.filter-select:focus{outline:2px solid var(--navy);outline-offset:1px;}
  .view-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;}
  .toggle-btn{font-family:'Inter',sans-serif;font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:7px;border:none;background:none;color:var(--muted);cursor:pointer;}
  .toggle-btn.active{background:var(--surface);color:var(--navy);box-shadow:var(--shadow);}
  .notice-tag{color:var(--warning);font-weight:700;}
  .movedout-tag{color:var(--muted);font-weight:700;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;border-radius:9px;
    padding:9px 15px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;
  }
  .btn svg{width:14px;height:14px;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-deep);}
  .btn-ghost{background:none;border:1px solid var(--border);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:7px;}
  .btn-danger-text{background:none;border:none;color:var(--danger);font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;font-size:12.5px;}

  /* ---------- table ---------- */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:11px 14px;background:#FAFBFD;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);}
  td{padding:11px 14px;border-top:1px solid var(--border);vertical-align:middle;}
  tr:hover td{background:#FAFBFE;}
  .name-cell{font-weight:700;}
  .sub-cell{color:var(--muted);font-size:12px;margin-top:1px;}

  .status-pill{
    display:inline-block;padding:4px 10px;border-radius:6px;font-weight:700;font-size:11.5px;
    cursor:pointer;border:none;font-family:'Inter',sans-serif;
    -webkit-appearance:none;appearance:none;
  }
  .status-Paid{background:var(--success-bg);color:var(--success);}
  .status-Pending{background:var(--warning-bg);color:var(--warning);}
  .status-Overdue{background:var(--danger-bg);color:var(--danger);}
  .status-New{background:#EAF0FB;color:var(--navy);}
  .status-VisitScheduled{background:var(--warning-bg);color:var(--warning);}
  .status-Visited{background:#E3F7F5;color:#0E7C74;}
  .status-Converted{background:var(--success-bg);color:var(--success);}
  .status-Lost{background:var(--danger-bg);color:var(--danger);}
  .status-Booked{background:#FBF1D9;color:#9A6A0E;}
  .status-Reserved{background:var(--warning-bg);color:var(--warning);}
  .status-Cancelled{background:var(--danger-bg);color:var(--danger);}
  .cat-pill-warning{background:var(--warning-bg);color:var(--warning);font-weight:700;padding:2px 8px;border-radius:6px;font-size:11px;}

  .status-Requested{background:#EAF0FB;color:var(--navy);}
  .status-Approved{background:var(--warning-bg);color:var(--warning);}
  .status-Declined{background:var(--danger-bg);color:var(--danger);}
  .status-Completed{background:var(--success-bg);color:var(--success);}
  .status-Open{background:var(--danger-bg);color:var(--danger);}
  .status-InProgress{background:var(--warning-bg);color:var(--warning);}
  .status-Resolved{background:var(--success-bg);color:var(--success);}
  .status-Active{background:var(--success-bg);color:var(--success);}
  .status-Inactive{background:#F1F2F6;color:var(--muted);}
  .star-rating{color:var(--yellow);letter-spacing:1px;font-size:13px;}
  .prop-beds-input{width:70px;font-family:'Inter',sans-serif;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);}
  .prop-notes-input{width:100%;min-width:140px;font-family:'Inter',sans-serif;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);}

  .mode-pill{display:inline-block;padding:4px 10px;border-radius:6px;font-weight:700;font-size:11.5px;}
  .mode-Cash{background:#FBF1D9;color:#9A6A0E;}
  .mode-Online{background:#EAF0FB;color:var(--navy);}

  .agreement-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;}
  .field input[type=file]{font-family:'Inter',sans-serif;font-size:12.5px;width:100%;padding:7px 0;border:none;background:none;}

  .row-actions{display:flex;gap:10px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-weight:700;font-size:12.5px;font-family:'Inter',sans-serif;}
  .icon-btn:hover{color:var(--navy);}

  .empty-state{padding:40px 20px;text-align:center;color:var(--muted);}
  .empty-state strong{display:block;color:var(--ink);font-size:15px;margin-bottom:4px;}

  /* ---------- tasks ---------- */
  .task-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:9px;display:flex;align-items:flex-start;gap:12px;box-shadow:var(--shadow);
  }
  .task-card.done{opacity:0.55;}
  .task-check{margin-top:3px;width:17px;height:17px;cursor:pointer;accent-color:var(--navy);}
  .task-main{flex:1;min-width:0;}
  .task-title{font-weight:700;font-size:14px;}
  .task-title.done{text-decoration:line-through;}
  .task-meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .cat-pill{background:#EAF0FB;color:var(--navy);font-weight:700;padding:2px 8px;border-radius:6px;font-size:11px;}
  .task-due-soon{color:var(--danger);font-weight:700;}
  .task-notes{font-size:12.5px;color:var(--muted);margin-top:5px;font-style:italic;}

  /* ---------- inventory ---------- */
  .stock-pill{display:inline-block;padding:4px 10px;border-radius:6px;font-weight:700;font-size:11.5px;}
  .stock-Low{background:var(--danger-bg);color:var(--danger);}
  .stock-OK{background:var(--success-bg);color:var(--success);}
  .qty-adjust{display:flex;align-items:center;gap:8px;}
  .qty-btn{
    width:23px;height:23px;border-radius:6px;border:1px solid var(--border);background:var(--surface);
    cursor:pointer;font-weight:800;font-family:'Inter',sans-serif;color:var(--navy);line-height:1;
  }
  .qty-btn:hover{border-color:var(--navy);}
  .qty-num{font-weight:800;min-width:34px;text-align:center;font-variant-numeric:tabular-nums;}
  .inv-cat-pill{background:#FBF1D9;color:#9A6A0E;font-weight:700;padding:2px 8px;border-radius:6px;font-size:11px;}
  .filter-select{
    font-family:'Inter',sans-serif;border:1px solid var(--border);border-radius:9px;padding:9px 12px;
    font-size:13.5px;background:var(--surface);
  }

  /* ---------- modal ---------- */
  .overlay{display:none;position:fixed;inset:0;background:rgba(15,27,61,0.42);align-items:center;justify-content:center;padding:20px;z-index:50;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:16px;padding:24px;max-width:420px;width:100%;box-shadow:0 16px 44px rgba(16,24,40,0.22);max-height:90vh;overflow-y:auto;}
  .modal h2{margin:0 0 16px;font-size:17px;font-weight:800;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;font-family:'Inter',sans-serif;font-size:13.5px;padding:9px 11px;border:1px solid var(--border);
    border-radius:8px;background:var(--bg);color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--navy);outline-offset:1px;}
  .field input[type=checkbox]{width:auto;}
  .field textarea{resize:vertical;min-height:54px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

  .loading-msg{padding:60px 0;text-align:center;color:var(--muted);font-weight:700;}

  /* ---------- responsive sidebar ---------- */
  @media(max-width:860px){
    .shell{flex-direction:column;}
    .sidebar{
      position:relative;width:100%;height:auto;flex-direction:row;align-items:center;
      padding:10px 14px;gap:14px;overflow-x:auto;
    }
    .sidebar-brand{padding:0;flex-shrink:0;}
    .brand-tagline{display:none;}
    .sidebar-nav{flex-direction:row;flex:1;gap:3px;}
    .nav-item{flex-direction:column;gap:3px;padding:7px 10px;font-size:10.5px;text-align:center;white-space:nowrap;}
    .sidebar-foot{display:none;}
    .main-content{padding:22px 18px 56px;}
    .kpi-grid{grid-template-columns:1fr 1fr;}
  }
  @media(max-width:460px){
    .kpi-grid{grid-template-columns:1fr;}
  }

  /* ---------- dashboard split ---------- */
  .dash-split{display:flex;gap:18px;align-items:flex-start;}
  .dash-left{width:308px;flex-shrink:0;}
  .dash-right{flex:1;min-width:0;}
  @media(max-width:1060px){
    .dash-split{flex-direction:column;}
    .dash-left{width:100%;}
    .dash-left .mini-card{position:static!important;}
  }

  /* ---------- room-request widget ---------- */
  .rr-widget{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:sticky;top:24px;}
  .rr-widget h3{margin:0 0 4px;font-size:14.5px;font-weight:800;}
  .rr-widget .rr-sub{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:14px;}
  .rr-widget .field{margin-bottom:11px;}
  .rr-widget .field label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px;}

  // ---------- STORAGE BACKEND ----------
  // Uses the real Claude Artifact storage API when available (cross-session sync within
  // claude.ai). If this file is opened directly in a browser (downloaded, double-clicked,
  // shared with staff, etc.) that API doesn't exist, so we fall back to localStorage —
  // and if even that's blocked, to an in-memory store so the app never hangs on load.
  var storageBackend = (function(){
    if(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'){
      return window.storage;
    }
    var lsOk = false;
    try{ localStorage.setItem('__un_probe__','1'); localStorage.removeItem('__un_probe__'); lsOk = true; }catch(e){ lsOk = false; }
    if(lsOk){
      return {
        get: async function(key){
          try{
            var raw = localStorage.getItem('un:'+key);
            return raw !== null ? {key:key, value:raw, shared:false} : null;
          }catch(e){ return null; }
        },
        set: async function(key, value){
          try{ localStorage.setItem('un:'+key, value); return {key:key, value:value, shared:false}; }
          catch(e){ return null; }
        },
        delete: async function(key){
          try{ localStorage.removeItem('un:'+key); }catch(e){}
          return null;
        },
        list: async function(prefix){
          var keys = [];
          try{
            for(var i=0;i<localStorage.length;i++){
              var k = localStorage.key(i);
              if(k && k.indexOf('un:')===0){
                var bare = k.slice(3);
                if(!prefix || bare.indexOf(prefix)===0) keys.push(bare);
              }
            }
          }catch(e){}
          return {keys:keys};
        }
      };
    }
    var mem = {};
    return {
      get: async function(key){ return mem[key]!==undefined ? {key:key, value:mem[key], shared:false} : null; },
      set: async function(key, value){ mem[key] = value; return {key:key, value:value, shared:false}; },
      delete: async function(key){ delete mem[key]; return null; },
      list: async function(prefix){
        var keys = Object.keys(mem).filter(function(k){ return !prefix || k.indexOf(prefix)===0; });
        return {keys:keys};
      }
    };
  })();

    var d = new Date(dateStr+'T00:00:00');

  }
  function fmtDateLong(dateStr){
    var d = new Date(dateStr+'T00:00:00');
    return d.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
  }

  function escapeHtml(s){
    return (s||'').toString().replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function slug(s){ return (s||'').toString().replace(/\s+/g,''); }

  function dataURLtoBlob(dataurl){
    var arr = dataurl.split(',');
    var mimeMatch = arr[0].match(/:(.*?);/);
    var mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
    var bstr = atob(arr[1]);
    var n = bstr.length;
    var u8arr = new Uint8Array(n);
    while(n--){ u8arr[n] = bstr.charCodeAt(n); }
    return new Blob([u8arr], {type:mime});
  }

  function fmtMoney(n){
    n = Number(n)||0;
    return '₹' + n.toLocaleString('en-IN');
  }

  function daysUntil(dateStr){
    if(!dateStr) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    var d = new Date(dateStr); d.setHours(0,0,0,0);
    return Math.round((d-today)/86400000);
  }

  function daysBetween(d1, d2){
    if(!d1 || !d2) return null;
    var a = new Date(d1+'T00:00:00');
    var b = new Date(d2+'T00:00:00');
    return Math.round((b-a)/86400000);
  }

  function paymentMonthTotals(propertyScope){
    var ym = todayStr().slice(0,7);
    var monthPayments = payments.filter(function(p){
      if((p.date||'').slice(0,7)!==ym) return false;
      if(propertyScope && p.property!==propertyScope) return false;
      return true;
    });
    var cashTotal=0, onlineTotal=0;
    monthPayments.forEach(function(p){
      var amt = Number(p.amount)||0;
      if(p.mode==='Cash') cashTotal += amt; else if(p.mode==='Online') onlineTotal += amt;
    });
    return {count:monthPayments.length, cash:cashTotal, online:onlineTotal, total:cashTotal+onlineTotal};
  }

  function isActiveResident(r){ return (r.lifecycleStatus||'Active') !== 'Moved Out'; }

  function getPropertyList(){
    var set = {};
    residents.forEach(function(r){ if(r.property) set[r.property] = true; });
    return Object.keys(set).sort();
  }

  // ---------- DASHBOARD ----------
  function renderBedBar(activeResidents, propertyScope){
    var owner = currentRole==='owner';
    var totalBeds;
    if(propertyScope){
      totalBeds = settings.propertyBeds[propertyScope] || 0;
    } else {
      totalBeds = 0;
      Object.keys(settings.propertyBeds).forEach(function(k){ totalBeds += settings.propertyBeds[k]||0; });
    }
    var paidCount=0, pendingCount=0, overdueCount=0;
    activeResidents.forEach(function(r){
      if(r.status==='Paid') paidCount++;
      else if(r.status==='Pending') pendingCount++;
      else if(r.status==='Overdue') overdueCount++;
    });
    var occupied = activeResidents.length;
    var vacant = Math.max(totalBeds - occupied, 0);
    var barTotal = Math.max(totalBeds, occupied, 1);
    function pct(n){ return (n/barTotal*100).toFixed(2); }

    var segs = '';
    if(paidCount) segs += '<div class="bed-seg seg-paid" style="width:'+pct(paidCount)+'%"></div>';
    if(pendingCount) segs += '<div class="bed-seg seg-pending" style="width:'+pct(pendingCount)+'%"></div>';
    if(overdueCount) segs += '<div class="bed-seg seg-overdue" style="width:'+pct(overdueCount)+'%"></div>';
    if(vacant) segs += '<div class="bed-seg seg-vacant" style="width:'+pct(vacant)+'%"></div>';
    if(!segs) segs = '<div class="bed-seg seg-vacant" style="width:100%"></div>';

    var overflowNote = occupied > totalBeds ?
      '<div class="bed-overflow-note">'+(occupied-totalBeds)+' more resident'+((occupied-totalBeds)===1?'':'s')+' than configured beds — update the total below.</div>' : '';

    var totalBedsField;
    if(propertyScope && owner){
      totalBedsField = '<span class="bed-total-edit"><input type="number" id="totalBedsInput" value="'+totalBeds+'" min="0" data-property="'+escapeHtml(propertyScope)+'" /></span>';
    } else if(!propertyScope){
      totalBedsField = '<strong>'+totalBeds+'</strong> <span style="font-size:11px;color:var(--muted);font-weight:600;">(pick a property below to edit)</span>';
    } else {
      totalBedsField = '<strong>'+totalBeds+'</strong>';
    }

    return '<div class="bed-bar-card">' +
      '<div class="bed-bar-head">' +
        '<div><h3>Bed status'+(propertyScope?' — '+escapeHtml(propertyScope):' — All Properties')+'</h3><div class="bed-bar-sub">'+occupied+' occupied of '+totalBedsField+' total beds</div></div>' +
      '</div>' +
      '<div class="bed-bar-track">'+segs+'</div>' +
      '<div class="bed-bar-legend">' +
        '<span class="legend-item"><span class="legend-dot dot-paid"></span>Paid · '+paidCount+'</span>' +
        '<span class="legend-item"><span class="legend-dot dot-pending"></span>Pending · '+pendingCount+'</span>' +
        '<span class="legend-item"><span class="legend-dot dot-overdue"></span>Overdue · '+overdueCount+'</span>' +
        '<span class="legend-item"><span class="legend-dot dot-vacant"></span>Vacant · '+vacant+'</span>' +
      '</div>' + overflowNote +
    '</div>';
  }

  function buildNoticeMessage(r, requiredDays){
    var days = daysBetween(r.noticeDate, r.moveOutDate);
    var complianceLine = days===null
      ? 'Please confirm your notice date so we can finalize the move-out details.'
      : days >= requiredDays
        ? 'Your notice meets our standard '+requiredDays+'-day policy — thank you for letting us know in advance!'
        : 'This is '+(requiredDays-days)+' day'+((requiredDays-days)===1?'':'s')+' short of our standard '+requiredDays+'-day notice policy. We may need to discuss applicable charges — feel free to reach out with any questions.';
    return 'Hi '+r.name+',\n\n' +
      'This confirms we have received your notice to vacate '+(r.room?('Room '+r.room):'your room')+(r.property?(' at '+r.property):'')+'.\n\n' +
      'Notice given on: '+(r.noticeDate||'not recorded')+'\n' +
      'Move-out date: '+(r.moveOutDate||'to be confirmed')+'\n' +
      'Required notice period: '+requiredDays+' days\n\n' +
      complianceLine+'\n\n' +
      'Please ensure the room and any pending dues are settled by the move-out date. Let us know if you have any questions.\n\n' +
      'Thank you,\nUrban Nest Management';
  }

  function renderNoticePeriodSection(activeResidents){

  function inferFloorLabel(room){
    if(!room) return 'Unspecified';
    var r = (''+room).trim();
    if(/^G\d*/i.test(r)) return 'Ground Floor';
    var m = r.match(/^(\d+)$/);
    if(m){
      var num = m[1];
      if(num.length <= 2) return 'Ground Floor';
      var floorNum = parseInt(num.slice(0, num.length-2), 10);
      return ordinalFloor(floorNum);
    }
    var m2 = r.match(/^([A-Za-z]+)/);
    if(m2) return 'Wing '+m2[1].toUpperCase();
    return 'Unspecified';
  }
  function ordinalFloor(n){
    if(n===0) return 'Ground Floor';
    var mod100 = n%100;
    var suf = (mod100>=11 && mod100<=13) ? 'th' : (n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th');
    return n+suf+' Floor';
  }
  function floorSortKey(label){
    if(label==='Ground Floor') return -1;
    var m = label.match(/^(\d+)/);
    if(m) return parseInt(m[1],10);
    if(/^Wing /.test(label)) return 500 + (label.charCodeAt(5)||0);
    return 9999;
  }

  // ---------- ROOM EXPLORER (Property -> Floor -> Room -> Beds) ----------
  function roomCapacityKey(property, room){ return (property||'')+'__'+(room||'Unspecified'); }
  function getRoomCapacity(property, room){
    var key = roomCapacityKey(property, room);
    if(typeof settings.roomCapacity[key] === 'number') return settings.roomCapacity[key];
    return residents.filter(isActiveResident).filter(function(r){
      return (r.property||'')===property && (r.room||'Unspecified')===(room||'Unspecified');
    }).length;
  }
  function seedRoomCapacityIfNeeded(){
    if(settings.roomCapacitySeeded) return;
    var counts = {};
    residents.filter(isActiveResident).forEach(function(r){
      var key = roomCapacityKey(r.property, r.room);
      counts[key] = (counts[key]||0) + 1;
    });
    Object.keys(counts).forEach(function(key){
      if(typeof settings.roomCapacity[key] !== 'number') settings.roomCapacity[key] = counts[key];
    });
    settings.roomCapacitySeeded = true;
    persist();
  }

  function renderExplorerFloors(property){
    var propResidents = residents.filter(isActiveResident).filter(function(r){ return r.property===property; });
    var rooms = {};
    propResidents.forEach(function(r){ var room=r.room||'Unspecified'; if(!rooms[room]) rooms[room]=[]; rooms[room].push(r); });
    var floors = {};
    Object.keys(rooms).forEach(function(room){ var f=inferFloorLabel(room); if(!floors[f]) floors[f]=[]; floors[f].push(room); });
    var floorNames = Object.keys(floors).sort(function(a,b){ return floorSortKey(a)-floorSortKey(b); });
    if(!floorNames.length) return '<div class="table-wrap"><div class="empty-state"><strong>No rooms yet for '+escapeHtml(property)+'</strong></div></div>';
    var cards = floorNames.map(function(floor){
      var roomList = floors[floor];
      var bedCount = roomList.reduce(function(s,room){ return s+rooms[room].length; }, 0);
      return '<div class="explorer-card" onclick="UN.explorerGoTo(\''+escapeHtml(property).replace(/'/g,"\\'")+'\',\''+escapeHtml(floor).replace(/'/g,"\\'")+'\',null)">' +
        '<div><div class="name-cell">'+escapeHtml(floor)+'</div><div class="sub-cell">'+roomList.length+' room'+(roomList.length===1?'':'s')+' · '+bedCount+' resident'+(bedCount===1?'':'s')+'</div></div>' +
        '<button class="btn btn-ghost btn-sm">View</button>' +
      '</div>';
    }).join('');
    return '<div class="explorer-list">'+cards+'</div>';
  }

  function renderExplorerRooms(property, floor){
    var propResidents = residents.filter(isActiveResident).filter(function(r){
      return r.property===property && inferFloorLabel(r.room||'Unspecified')===floor;
    });
    var rooms = {};
    propResidents.forEach(function(r){ var room=r.room||'Unspecified'; if(!rooms[room]) rooms[room]=[]; rooms[room].push(r); });
    var roomNames = Object.keys(rooms).sort(function(a,b){ return a.localeCompare(b, undefined, {numeric:true}); });
    if(!roomNames.length) return '<div class="table-wrap"><div class="empty-state"><strong>No rooms found on '+escapeHtml(floor)+'</strong></div></div>';
    var summary = '<div class="panel-tag" style="margin-bottom:12px;">'+roomNames.length+' room'+(roomNames.length===1?'':'s')+' on '+escapeHtml(floor)+'</div>';
    var cards = roomNames.map(function(room){
      var occupants = rooms[room];
      var capacity = getRoomCapacity(property, room);
      var emptyBeds = Math.max(capacity - occupants.length, 0);
      return '<div class="explorer-card" onclick="UN.explorerGoTo(\''+escapeHtml(property).replace(/'/g,"\\'")+'\',\''+escapeHtml(floor).replace(/'/g,"\\'")+'\',\''+escapeHtml(room).replace(/'/g,"\\'")+'\')">' +
        '<div><div class="name-cell">'+escapeHtml(room)+'</div><div class="sub-cell">'+occupants.length+' of '+capacity+' bed'+(capacity===1?'':'s')+' occupied'+(emptyBeds?(' · '+emptyBeds+' available'):'')+'</div></div>' +
        '<button class="btn btn-ghost btn-sm">View</button>' +
      '</div>';
    }).join('');
    return summary + '<div class="explorer-list">'+cards+'</div>';
  }

  function renderExplorerRoomDetail(property, floor, room){
    var owner = currentRole==='owner';
    var occupants = residents.filter(isActiveResident).filter(function(r){
      return r.property===property && (r.room||'Unspecified')===room;
    });
    var capacity = getRoomCapacity(property, room);
    var overflow = occupants.length > capacity;
    var slots = Math.max(capacity, occupants.length);
    var bedsHtml = '';
    for(var i=0;i<slots;i++){
      var occ = occupants[i];
      if(occ){
        bedsHtml += '<div class="bed-slot bed-occupied"><span class="legend-dot dot-paid"></span><div><div class="name-cell">Bed '+(i+1)+' — '+escapeHtml(occ.name)+'</div><div class="sub-cell"><span class="status-pill status-'+occ.status+'">'+occ.status+'</span></div></div></div>';
      } else {
        bedsHtml += '<div class="bed-slot bed-empty"><span class="legend-dot dot-vacant"></span><div><div class="name-cell" style="color:var(--muted);">Bed '+(i+1)+' — Available</div></div></div>';
      }
    }
    var capacityField = owner
      ? '<span class="bed-total-edit"><input type="number" min="0" id="roomCapacityInput" data-property="'+escapeHtml(property)+'" data-room="'+escapeHtml(room)+'" value="'+capacity+'" /></span>'
      : '<strong>'+capacity+'</strong>';
    var overflowNote = overflow ? '<div class="bed-overflow-note">'+(occupants.length-capacity)+' more resident'+((occupants.length-capacity)===1?'':'s')+' than configured beds — update the bed count above.</div>' : '';
    return '<div class="bed-bar-card">' +
      '<div class="bed-bar-head"><div><h3>'+escapeHtml(room)+'</h3><div class="bed-bar-sub">'+occupants.length+' occupied of '+capacityField+' total beds</div></div></div>' +
      '<div class="bed-grid">'+bedsHtml+'</div>' + overflowNote +
      '<div class="bed-bar-legend" style="margin-top:14px;"><span class="legend-item"><span class="legend-dot dot-paid"></span>Occupied</span><span class="legend-item"><span class="legend-dot dot-vacant"></span>Empty / Available</span></div>' +
    '</div>';
  }

  function renderRoomExplorer(){
    if(!roomExplorerProperty){
      return '<div class="panel-tag" style="margin-bottom:12px;">Select a property to explore its floors, rooms, and beds</div>' + renderExplorerProperties();
    }
    if(!roomExplorerFloor){
      return renderExplorerBreadcrumb() + renderExplorerFloors(roomExplorerProperty);
    }
    if(!roomExplorerRoom){
      return renderExplorerBreadcrumb() + renderExplorerRooms(roomExplorerProperty, roomExplorerFloor);
    }
    return renderExplorerBreadcrumb() + renderExplorerRoomDetail(roomExplorerProperty, roomExplorerFloor, roomExplorerRoom);
  }

  function renderPaymentMixCard(propertyScope){
    var pm = paymentMonthTotals(propertyScope);
    function pct(n){ return pm.total ? (n/pm.total*100).toFixed(2) : 0; }
    var segs = pm.total ?

  // ---------- EXPENSES ----------
  var EXPENSE_CATEGORIES = ['Salaries','Utilities','Groceries/Kitchen','Maintenance/Supplies','Fuel/Transport','Office/Misc','Medical','Landlord Rent','Needs Review'];

  function renderExpensesSummary(){
    var total = expenses.reduce(function(s,e){ return s+(Number(e.amount)||0); }, 0);
    var byCategory = {};
    expenses.forEach(function(e){
      var cat = e.category || 'Needs Review';
      if(!byCategory[cat]) byCategory[cat] = {amount:0, count:0};
      byCategory[cat].amount += Number(e.amount)||0;
      byCategory[cat].count += 1;
    });
    var needsReview = byCategory['Needs Review'] || {amount:0,count:0};
    var rows = EXPENSE_CATEGORIES.filter(function(c){ return byCategory[c]; }).map(function(c){
      var d = byCategory[c];
      var warn = c==='Needs Review';
      return '<div class="mini-row"><span>'+(warn?'<span class="cat-pill-warning">':'<span class="cat-pill">')+escapeHtml(c)+'</span> · '+d.count+'</span><strong'+(warn?' style="color:var(--warning)"':'')+'>'+fmtMoney(d.amount)+'</strong></div>';
    }).join('');
    return '<div class="bed-bar-card">' +
      '<div class="bed-bar-head"><div><h3>Expenses overview</h3><div class="bed-bar-sub">'+fmtMoney(total)+' logged across '+expenses.length+' entries'+(needsReview.count?(' · <span style="color:var(--warning);font-weight:700;">'+fmtMoney(needsReview.amount)+' needs review</span>'):'')+'</div></div></div>' +
      '<div style="margin-top:6px;">'+rows+'</div>' +
    '</div>';
  }

  // ---------- REQUESTS & GUESTS HUB ----------
  var ROOMREQ_STATUSES = ['Requested','Approved','Declined','Completed'];

  function residentOptionsHtml(selectedId, fallbackName){
    var sortedResidents = residents.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
    var opts = sortedResidents.map(function(r){
      return '<option value="'+r.id+'" '+(r.id===selectedId?'selected':'')+'>'+escapeHtml(r.name)+(r.room?(' — '+escapeHtml(r.room)):'')+(r.property?(' ('+escapeHtml(r.property)+')'):'')+'</option>';
    }).join('');
    var orphan = selectedId && !residents.find(function(r){ return r.id===selectedId; });
    if(orphan){
      opts = '<option value="'+selectedId+'" selected>'+escapeHtml(fallbackName||'Unknown')+' (removed)</option>' + opts;

  function noResidentsModalHtml(title){
    return '<div class="modal"><h2>'+title+'</h2>' +
      '<p style="font-size:13px;color:var(--muted);">Add a resident first from the Residents tab, then come back to log this.</p>' +

  function renderRequestsHub(){
    var segs = [
      {key:'guests', label:'Guests'},
      {key:'roomRequests', label:'Room Requests'},
      {key:'complaints', label:'Complaints'},
      {key:'reviews', label:'Reviews'}
    ];
    var switcher = '<div class="view-toggle" style="margin-bottom:16px;">' +
      segs.map(function(s){
        return '<button class="toggle-btn '+(requestsSegment===s.key?'active':'')+'" onclick="UN.setRequestsSegment(\''+s.key+'\')">'+s.label+'</button>';
      }).join('') +
    '</div>';
    var body = requestsSegment==='roomRequests' ? renderRoomRequests()
      : requestsSegment==='complaints' ? renderComplaints()
      : requestsSegment==='reviews' ? renderReviews()
      : renderGuests();
    return switcher + body;

  function renderGuests(){
    var sorted = guests.slice().sort(function(a,b){ return (b.visitDate||'').localeCompare(a.visitDate||''); });
    var rows = sorted.map(function(g){
      return '<tr>' +
        '<td>'+(g.visitDate||'—')+'</td>' +
        '<td><div class="name-cell">'+escapeHtml(g.guestName)+'</div><div class="sub-cell">visiting '+escapeHtml(g.residentName||'—')+'</div></td>' +
        '<td>'+escapeHtml(g.room||'—')+'</td>' +
        '<td>'+escapeHtml(g.property||'—')+'</td>' +
        '<td class="sub-cell">'+escapeHtml(g.notes||'—')+'</td>' +
        '<td class="row-actions"><button class="icon-btn" onclick="UN.editGuest(\''+g.id+'\')">Edit</button><button class="icon-btn" style="color:var(--danger)" onclick="UN.deleteGuest(\''+g.id+'\')">Remove</button></td>' +

        : '<span class="status-pill status-'+slug(rq.status)+'">'+rq.status+'</span>';
      var actionsCell = owner
        ? '<td class="row-actions"><button class="icon-btn" onclick="UN.editRoomRequest(\''+rq.id+'\')">Edit</button><button class="icon-btn" style="color:var(--danger)" onclick="UN.deleteRoomRequest(\''+rq.id+'\')">Remove</button></td>'
        : '<td class="row-actions"><span style="color:var(--muted);font-size:12px;">View only</span></td>';

        '<td><div class="name-cell">'+escapeHtml(rq.residentName||'—')+'</div><div class="sub-cell">'+escapeHtml(rq.property||'')+'</div></td>' +
        '<td>'+escapeHtml(rq.currentRoom||'—')+' → '+escapeHtml(rq.requestedRoom||'—')+(rq.requestedProperty&&rq.requestedProperty!==rq.property?'<div class="sub-cell">→ '+escapeHtml(rq.requestedProperty)+'</div>':'')+'</td>' +

        '<td>'+(c.dateRaised||'—')+'</td>' +

        '<td class="row-actions"><button class="icon-btn" onclick="UN.editComplaint(\''+c.id+'\')">Edit</button><button class="icon-btn" style="color:var(--danger)" onclick="UN.deleteComplaint(\''+c.id+'\')">Remove</button></td>' +
      '</tr>';
    }).join('');
    var tableOrEmpty = sorted.length ?
      '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Resident</th><th>Category</th><th>Description</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>' :
      '<div class="table-wrap"><div class="empty-state"><strong>No complaints logged</strong>Track issues residents raise so nothing falls through the cracks.</div></div>';

  function renderReviews(){
    var sorted = reviews.slice().sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
    var avg = sorted.length ? (sorted.reduce(function(s,r){ return s+(Number(r.rating)||0); },0)/sorted.length) : 0;
    var rows = sorted.map(function(rv){
      var filled = Math.round(Number(rv.rating)||0);
      var starStr = '';
      for(var i=0;i<5;i++){ starStr += i<filled ? '★' : '☆'; }
      return '<tr>' +
        '<td>'+(rv.date||'—')+'</td>' +
        '<td><div class="name-cell">'+escapeHtml(rv.residentName||'—')+'</div><div class="sub-cell">'+escapeHtml(rv.property||'')+'</div></td>' +
        '<td><span class="star-rating">'+starStr+'</span></td>' +
        '<td>'+escapeHtml(rv.source||'—')+'</td>' +
        '<td class="sub-cell">'+escapeHtml(rv.comment||'—')+'</td>' +
        '<td class="row-actions"><button class="icon-btn" onclick="UN.editReview(\''+rv.id+'\')">Edit</button><button class="icon-btn" style="color:var(--danger)" onclick="UN.deleteReview(\''+rv.id+'\')">Remove</button></td>' +
      '</tr>';
    }).join('');
    var tableOrEmpty = sorted.length ?
      '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Resident</th><th>Rating</th><th>Source</th><th>Comment</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>' :
      '<div class="table-wrap"><div class="empty-state"><strong>No reviews logged</strong>Capture feedback you hear through Google, exit interviews, or WhatsApp here.</div></div>';
    return '<div class="toolbar">' +
      (sorted.length ? '<div class="panel-tag" style="margin:0;">Average rating: '+avg.toFixed(1)+' / 5 across '+sorted.length+' review'+(sorted.length===1?'':'s')+'</div>' : '<div></div>') +
      '<button class="btn btn-primary" onclick="UN.openReviewModal()">'+ICONS.plus+'<span>Log review</span></button>' +
    '</div>' + tableOrEmpty;
  }

  // ---------- TASKS ----------
  function renderTasks(){
    var sorted = tasks.slice().sort(function(a,b){
      if((a.status==='Done') !== (b.status==='Done')) return a.status==='Done' ? 1 : -1;
      return (a.dueDate||'9999').localeCompare(b.dueDate||'9999');
    });
    var cards = sorted.map(function(t){
      var d = daysUntil(t.dueDate);
      var soon = t.status!=='Done' && d!==null && d<=3;
      return '<div class="task-card '+(t.status==='Done'?'done':'')+'">' +
        '<input type="checkbox" class="task-check" '+(t.status==='Done'?'checked':'')+' onchange="UN.toggleTask(\''+t.id+'\')" />' +
        '<div class="task-main">' +
          '<div class="task-title '+(t.status==='Done'?'done':'')+'">'+escapeHtml(t.title)+'</div>' +
          '<div class="task-meta"><span class="cat-pill">'+escapeHtml(t.category||'Other')+'</span><span class="'+(soon?'task-due-soon':'')+'">'+(t.dueDate?('Due '+t.dueDate):'No due date')+'</span>'+(t.assignee?('<span>Assigned: '+escapeHtml(t.assignee)+'</span>'):'')+'</div>' +
          (t.notes ? '<div class="task-notes">'+escapeHtml(t.notes)+'</div>' : '') +
        '</div>' +
        '<button class="btn-danger-text" onclick="UN.deleteTask(\''+t.id+'\')">Delete</button>' +
      '</div>';
    }).join('');

    var listOrEmpty = sorted.length ? cards :
      '<div class="table-wrap"><div class="empty-state"><strong>No tasks yet</strong>Add housekeeping, maintenance, or move-in/out tasks to track them here.</div></div>';

    return '<div class="toolbar"><div></div><button class="btn btn-primary" onclick="UN.openTaskModal()">'+ICONS.plus+'<span>Add task</span></button></div>' + listOrEmpty;
  }

  // ---------- DAILY LOG ----------
  function renderDailyLog(){
    var todayKey = todayStr();
    var todaysEntry = dailyLog[selectedLogDate] || {};
    var doneCount = duties.filter(function(d){ return !!todaysEntry[d.id]; }).length;

    var checklist = duties.length ? duties.map(function(d){
      var checked = !!todaysEntry[d.id];
      return '<div class="duty-row">' +
        '<label class="duty-row-label"><input type="checkbox" class="task-check" '+(checked?'checked':'')+' onchange="UN.toggleDuty(\''+d.id+'\')" /><span>'+escapeHtml(d.name)+'</span>'+(d.core?'<span class="cat-pill" style="margin-left:8px;">Core</span>':'')+'</label>' +
        (d.core ? '' : '<button class="icon-btn" style="color:var(--danger)" onclick="UN.deleteDuty(\''+d.id+'\')">Remove</button>') +
      '</div>';
    }).join('') : '<div class="mini-empty">No duties yet. Add Cleaning, Motor, or anything else you want tracked daily.</div>';

    var last7 = [];
    for(var k=6;k>=0;k--){ last7.push(addDays(selectedLogDate, -k)); }

    var historyTable = '';
    if(duties.length){
      var headCells = last7.map(function(d){
        return '<th style="text-align:center;'+(d===selectedLogDate?'color:var(--navy);':'')+'">'+fmtDayLabel(d)+'</th>';
      }).join('');
      var bodyRows = duties.map(function(duty){
        var cells = last7.map(function(d){
          var done = !!(dailyLog[d] && dailyLog[d][duty.id]);
          return '<td style="text-align:center;">'+(done?'<span class="duty-check">&#10003;</span>':'<span class="duty-empty">&mdash;</span>')+'</td>';
        }).join('');
        return '<tr><td class="name-cell">'+escapeHtml(duty.name)+'</td>'+cells+'</tr>';
      }).join('');
      historyTable = '<div class="table-wrap"><table><thead><tr><th>Duty</th>'+headCells+'</tr></thead><tbody>'+bodyRows+'</tbody></table></div>';
    }

    return '' +
    '<div class="toolbar">' +
      '<div class="date-nav">' +
        '<button class="qty-btn" onclick="UN.shiftLogDate(-1)">&lsaquo;</button>' +
        '<input type="date" class="filter-select" id="logDateInput" value="'+selectedLogDate+'" onchange="UN.setLogDate(this.value)" />' +
        '<button class="qty-btn" onclick="UN.shiftLogDate(1)">&rsaquo;</button>' +
        (selectedLogDate!==todayKey ? '<button class="btn btn-ghost btn-sm" onclick="UN.setLogDate(\''+todayKey+'\')">Today</button>' : '') +
      '</div>' +
      '<button class="btn btn-primary" onclick="UN.openDutyModal()">'+ICONS.plus+'<span>Add duty</span></button>' +
    '</div>' +
    '<div class="mini-card" style="margin-bottom:14px;">' +
      '<div class="panel-card-head"><h3>Checklist — '+fmtDateLong(selectedLogDate)+'</h3><span class="panel-tag" style="margin:0;">'+doneCount+' of '+duties.length+' done</span></div>' +
      checklist +
    '</div>' +
    (duties.length ? '<div class="mini-card"><h3 style="margin-bottom:12px;">Last 7 days</h3>'+historyTable+'</div>' : '');
  }

  // ---------- INVENTORY ----------
  var INV_CATEGORIES = ['Groceries','Toiletries','Cleaning Supplies','Kitchen','Maintenance','Other'];

  function renderInventory(){
    var filtered = inventory.filter(function(i){
      return !invCategoryFilter || i.category===invCategoryFilter;
    });
    filtered = filtered.slice().sort(function(a,b){
      var aLow = Number(a.qty)<=Number(a.threshold), bLow = Number(b.qty)<=Number(b.threshold);
      if(aLow!==bLow) return aLow ? -1 : 1;
      return (a.name||'').localeCompare(b.name||'');
    });

    var rows = filtered.map(function(i){
      var low = Number(i.qty)<=Number(i.threshold);
      var value = (Number(i.qty)||0)*(Number(i.cost)||0);
      return '<tr>' +
        '<td><div class="name-cell">'+escapeHtml(i.name)+'</div><div class="sub-cell"><span class="inv-cat-pill">'+escapeHtml(i.category||'Other')+'</span></div></td>' +
        '<td><div class="qty-adjust">' +
          '<button class="qty-btn" onclick="UN.adjustStock(\''+i.id+'\',-1)">−</button>' +
          '<span class="qty-num">'+i.qty+'</span>' +
          '<button class="qty-btn" onclick="UN.adjustStock(\''+i.id+'\',1)">+</button>' +
          '<span class="sub-cell">'+escapeHtml(i.unit||'')+'</span>' +
        '</div><div class="sub-cell">reorder at '+i.threshold+'</div></td>' +
        '<td><span class="stock-pill '+(low?'stock-Low':'stock-OK')+'">'+(low?'Low Stock':'OK')+'</span></td>' +
        '<td>'+(i.cost?fmtMoney(value):'—')+'<div class="sub-cell">'+escapeHtml(i.lastRestocked||'')+'</div></td>' +
        '<td class="row-actions"><button class="icon-btn" onclick="UN.editInventory(\''+i.id+'\')">Edit</button><button class="icon-btn" style="color:var(--danger)" onclick="UN.deleteInventory(\''+i.id+'\')">Remove</button></td>' +
      '</tr>';
    }).join('');

    var tableOrEmpty = filtered.length ?
      '<div class="table-wrap"><table><thead><tr><th>Item</th><th>Stock</th><th>Status</th><th>Value</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>' :
      '<div class="table-wrap"><div class="empty-state"><strong>No items yet</strong>Add groceries, toiletries, or cleaning supplies to start tracking stock.</div></div>';

    return '' +
    '<div class="toolbar">' +
      '<select class="filter-select" id="invCategoryFilter"><option value="">All categories</option>' +
        INV_CATEGORIES.map(function(c){ return '<option value="'+c+'" '+(c===invCategoryFilter?'selected':'')+'>'+c+'</option>'; }).join('') +
      '</select>' +
      '<button class="btn btn-primary" onclick="UN.openInventoryModal()">'+ICONS.plus+'<span>Add item</span></button>' +
    '</div>' + tableOrEmpty;
  }

  function renderProperties(){
    var owner = currentRole==='owner';
    var propertyList = getPropertyList();
    var rows = propertyList.map(function(p){
      var beds = settings.propertyBeds[p]||0;
      var occupied = residents.filter(function(r){ return r.property===p && isActiveResident(r); }).length;
      var occPct = beds ? Math.round((occupied/beds)*100) : 0;
      var meta = settings.propertyMeta[p] || {};
      var bedsCell = owner
        ? '<input type="number" min="0" class="prop-beds-input" data-property="'+escapeHtml(p)+'" value="'+beds+'" />'
        : ''+beds;
      var notesCell = owner
        ? '<input type="text" class="prop-notes-input" data-property="'+escapeHtml(p)+'" value="'+escapeHtml(meta.notes||'')+'" placeholder="address / notes" />'
        : escapeHtml(meta.notes||'—');
      return '<tr>' +
        '<td class="name-cell">'+escapeHtml(p)+'</td>' +
        '<td>'+bedsCell+'</td>' +
        '<td>'+occupied+' ('+occPct+'%)</td>' +
        '<td>'+notesCell+'</td>' +
        (owner ? '<td class="row-actions"><button class="icon-btn" style="color:var(--danger)" onclick="UN.deleteProperty(\''+escapeHtml(p)+'\')">Remove</button></td>' : '<td></td>') +
      '</tr>';
    }).join('');
    var tableOrEmpty = propertyList.length ?
      '<div class="table-wrap"><table><thead><tr><th>Property</th><th>Total beds</th><th>Occupied</th><th>Notes</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>' :
      '<div class="table-wrap"><div class="empty-state"><strong>No properties yet</strong>Add a property to start tracking beds and occupancy for it.</div></div>';
    return '<div class="toolbar"><div></div>' +
      (owner ? '<button class="btn btn-primary" onclick="UN.openPropertyModal()">'+ICONS.plus+'<span>Add property</span></button>' : '<span class="staff-note">Staff Mode — properties are view-only</span>') +
    '</div>' + tableOrEmpty;

  function renderCaretakers(){
    var owner = currentRole==='owner';

  // ---------- PUBLIC API ----------
  window.UN = {
    setTab: function(t){ activeTab = t; searchTerm=''; enqSearchTerm=''; paySearchTerm=''; render(); },
    setResidentView: function(v){ residentView = v; render(); },
    explorerGoTo: function(property, floor, room){
      roomExplorerProperty = property;
      roomExplorerFloor = floor;
      roomExplorerRoom = room;
      render();
    },

    openResidentModal: function(){
      if(currentRole!=='owner') return;
      pendingAgreementFile = null;
      pendingConvertEnquiryId = null;
      openOverlay(residentModalHtml());
    },
    editResident: function(id){
      if(currentRole!=='owner') return;
      pendingAgreementFile = null;
      pendingConvertEnquiryId = null;
      var r = residents.find(function(x){ return x.id===id; });
      openOverlay(residentModalHtml(r));
    },
    saveResident: function(id){
      var existing = residents.find(function(x){ return x.id===id; });
      var fileToSave = pendingAgreementFile;
      var convertId = pendingConvertEnquiryId;
      var convertBookingId = pendingConvertBookingId;
      var data = {
        id: id || uid(),
        name: document.getElementById('f_name').value.trim() || 'Unnamed resident',
        phone: document.getElementById('f_phone').value.trim(),
        property: document.getElementById('f_property').value.trim(),
        room: document.getElementById('f_room').value.trim(),
        roomType: document.getElementById('f_roomType').value,
        rent: document.getElementById('f_rent').value,
        dueDay: document.getElementById('f_dueDay').value,
        status: document.getElementById('f_status').value,
        notes: document.getElementById('f_notes').value.trim(),
        moveInDate: document.getElementById('f_moveInDate').value,
        lifecycleStatus: document.getElementById('f_lifecycle').value,
        noticeDate: document.getElementById('f_noticeDate').value,
        moveOutDate: document.getElementById('f_moveOutDate').value,
        agreementName: fileToSave ? fileToSave.name : (existing ? existing.agreementName : undefined)
      };
      var idx = residents.findIndex(function(x){ return x.id===id; });
      if(idx>=0) residents[idx] = data; else residents.push(data);
      if(convertId){
        var enq = enquiries.find(function(x){ return x.id===convertId; });
        if(enq){ enq.status = 'Converted'; }
      }
      if(convertBookingId){
        var bk = bookings.find(function(x){ return x.id===convertBookingId; });
        if(bk){ bk.status = 'Converted'; }
      }
      persist();
      if(fileToSave){
        storageBackend.set('agreement:'+data.id, fileToSave.dataUrl, false).catch(function(){});
      }
      closeModal(); render();
    },
    deleteResident: function(id){
      if(currentRole!=='owner') return;
      residents = residents.filter(function(x){ return x.id!==id; });
      storageBackend.delete('agreement:'+id, false).catch(function(){});
      persist(); render();
    },
    setStatus: function(id, status){
      if(currentRole!=='owner') return;
      var r = residents.find(function(x){ return x.id===id; });
      if(r){ r.status = status; persist(); render(); }
    },

    handleAgreementFile: function(input){
      var file = input.files && input.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        pendingAgreementFile = {name:file.name, dataUrl:reader.result};
        var label = document.getElementById('agreementFileLabel');
        if(label) label.textContent = 'Selected: ' + file.name;
      };
      reader.readAsDataURL(file);
    },
    viewAgreement: async function(id){
      try{
        var res = await storageBackend.get('agreement:'+id);
        if(res && res.value){
          var blob = dataURLtoBlob(res.value);
          var url = URL.createObjectURL(blob);
          window.open(url, '_blank');
        }
      }catch(e){}
    },
    removeAgreement: function(id){
      var r = residents.find(function(x){ return x.id===id; });
      if(r){ delete r.agreementName; persist(); }
      storageBackend.delete('agreement:'+id, false).catch(function(){});
      pendingAgreementFile = null;
      openOverlay(residentModalHtml(r));
    },

      };

    adjustStock: function(id, delta){
      var i = inventory.find(function(x){ return x.id===id; });
      if(!i) return;
      var newQty = (Number(i.qty)||0) + delta;
      i.qty = newQty < 0 ? 0 : newQty;
      if(delta > 0) i.lastRestocked = new Date().toISOString().slice(0,10);
      persist(); render();
    },

    saveBooking: function(id){
      if(currentRole!=='owner') return;
      var enqId = pendingBookEnquiryId;
      var existing = bookings.find(function(x){ return x.id===id; });
      var data = {
        id: id || uid(),
        name: document.getElementById('b_name').value.trim() || 'Unnamed prospect',
        phone: document.getElementById('b_phone').value.trim(),
        property: document.getElementById('b_property').value.trim(),
        room: document.getElementById('b_room').value.trim(),
        tokenAmount: document.getElementById('b_tokenAmount').value || 0,
        tokenMode: document.getElementById('b_tokenMode').value,
        bookingDate: document.getElementById('b_bookingDate').value || todayStr(),
        expectedMoveIn: document.getElementById('b_expectedMoveIn').value,
        notes: document.getElementById('b_notes').value.trim(),
        status: existing ? existing.status : 'Reserved'
      };
      var idx = bookings.findIndex(function(x){ return x.id===id; });
      var isNew = idx<0;
      if(idx>=0) bookings[idx] = data; else bookings.push(data);

      if(isNew && Number(data.tokenAmount)>0){
        payments.push({
          id: uid(), residentId: '', residentName: data.name, room: data.room, property: data.property,
          amount: data.tokenAmount, mode: data.tokenMode, date: data.bookingDate, note: 'Booking token'
        });
      }
      if(isNew && enqId){
        var enq = enquiries.find(function(x){ return x.id===enqId; });
        if(enq){ enq.status = 'Booked'; }
      }
      pendingBookEnquiryId = null;
      persist(); closeModal(); render();

    prefillPaymentAmount: function(residentId){

    savePayment: function(id){

      if(!residents.length){ closeModal(); return; }
      var residentSel = document.getElementById('p_residentId');
      var residentId = residentSel.value;
      var residentObj = residents.find(function(x){ return x.id===residentId; });
      var existing = payments.find(function(x){ return x.id===id; });
      var data = {
        id: id || uid(),
        residentId: residentId,
        residentName: residentObj ? residentObj.name : (existing ? existing.residentName : 'Unknown'),
        room: residentObj ? residentObj.room : (existing ? existing.room : ''),
        property: residentObj ? residentObj.property : (existing ? existing.property : ''),
        amount: document.getElementById('p_amount').value || 0,
        mode: document.getElementById('p_mode').value,
        date: document.getElementById('p_date').value || todayStr(),

    copyNoticeMessage: function(){
      var ta = document.getElementById('notice_message_text');
      if(!ta) return;
      function fallbackCopy(){
        ta.removeAttribute('readonly');
        ta.select();
        try{ document.execCommand('copy'); }catch(e){}
        ta.setAttribute('readonly','readonly');
      }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
      var label = document.getElementById('copyBtnLabel');
      if(label){
        label.textContent = 'Copied!';
        setTimeout(function(){
          var l = document.getElementById('copyBtnLabel');
          if(l) l.textContent = 'Copy message';
        }, 1500);
      }
    },

    // ---------- Dashboard room-request widget ----------
    dashRRSetResident: function(id){
      dashRRResidentId = id;
      // auto-prefill building from resident's current property if none chosen yet
      if(!dashRRProperty){
        var r = residents.find(function(x){ return x.id===id; });
        if(r && r.property) dashRRProperty = r.property;
      }
      render();
    },
    dashRRSetProperty: function(p){
      dashRRProperty = p;
      dashRRRoom = '';   // room options change, clear selection
      render();
    },
    dashRRSetRoom: function(v){ dashRRRoom = v; },
    dashRRSetNotes: function(v){ dashRRNotes = v; },
    dashRRReset: function(){
      dashRRResidentId = '';
      dashRRProperty = '';
      dashRRRoom = '';
      dashRRNotes = '';
      dashRRSuccess = false;
      render();
    },
    submitDashRoomRequest: function(){
      var residentObj = residents.find(function(x){ return x.id===dashRRResidentId; });
      if(!residentObj){
        var sel = document.getElementById('dashRR_resident');
        if(sel) sel.focus();
        return;
      }
      // read uncontrolled fields at submit time
      var targetRoom = (document.getElementById('dashRR_room')||{}).value || dashRRRoom || '';
      var targetNotes = (document.getElementById('dashRR_notes')||{}).value || dashRRNotes || '';
      var targetProperty = dashRRProperty;
      if(!targetRoom && !targetProperty){
        var ri = document.getElementById('dashRR_room');
        if(ri){ ri.style.outline='2px solid var(--danger)'; ri.focus(); setTimeout(function(){ if(ri) ri.style.outline=''; }, 1600); }
        return;
      }
      roomRequests.push({
        id: uid(),
        residentId: dashRRResidentId,
        residentName: residentObj.name,
        currentRoom: residentObj.room || '',
        property: residentObj.property || '',
        requestedRoom: targetRoom || '—',
        requestedProperty: targetProperty || '',
        reason: targetNotes,
        status: 'Requested',
        requestDate: todayStr()
      });
      dashRRSuccess = true;
      dashRRNotes = '';
      dashRRRoom = '';
      persist();
      render();
    }
